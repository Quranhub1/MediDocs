services:
  - type: web
    name: medidocs
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_FIREBASE_API_KEY
        value: your_firebase_api_key
      - key: REACT_APP_FIREBASE_AUTH_DOMAIN
        value: your_project.firebaseapp.com
      - key: REACT_APP_FIREBASE_PROJECT_ID
        value: your_project_id
      - key: REACT_APP_FIREBASE_STORAGE_BUCKET
        value: your_project.firebasestorage.app
      - key: REACT_APP_FIREBASE_MESSAGING_SENDER_ID
        value: your_sender_id
      - key: REACT_APP_FIREBASE_APP_ID
        value: your_app_id
      - key: REACT_APP_FIREBASE_MEASUREMENT_ID
        value: your_measurement_id
      - key: REACT_APP_OPENAI_API_KEY
        value: your_groq_api_key
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: REACT_APP_PAYSTACK_PUBLIC_KEY
        value: pk_test_your_paystack_public_key
      - key: PAYSTACK_SECRET_KEY
        value: sk_test_your_paystack_secret_key
